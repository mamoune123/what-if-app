<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// "Et si…": the phone front-end of the What If studio. A new episode is an issue of the studio's private repository,
// each choice or note is a comment ("/hook 2", "/board S12: …"), and each reply from the pipeline carries a hidden
// block (<!-- whatif {...} -->) that says which step it is and what to show. The token stays in this browser.
// ?demo shows every step with sample data and no network.

const LS = {
  get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const DEMO = new URLSearchParams(location.search).has('demo');
const state = { repo: LS.get('wi_repo', 'mamoune123/what-if-studio'), token: LS.get('wi_token'), timer: null, blobs: new Map() };
const $app = document.getElementById('app');
const OK_RE = /^(ok|okay|ok go|oui|go|valide|validé|c.est bon)[.!?]*$/i;

const STATUS = {
  'script-en-cours': { label: 'Claude travaille…', emoji: '✍️', color: 'var(--gold)', live: true },
  'script-pret': { label: 'À toi de jouer', emoji: '👉', color: 'var(--cyan)', live: false },
  'video-en-cours': { label: 'Vidéo en fabrication', emoji: '🎬', color: 'var(--orange)', live: true },
  'video-prete': { label: 'Vidéo prête', emoji: '✅', color: 'var(--green)', live: false },
  echec: { label: 'Échec, à relancer', emoji: '⚠️', color: 'var(--red)', live: false },
  nouveau: { label: 'Démarrage…', emoji: '⏳', color: 'var(--gold)', live: true },
};
// what each waiting step asks of the person
const STAGE = {
  hooks: { title: 'Choisis ton hook', emoji: '🪝', step: 1 },
  outline: { title: 'Valide le plan de l’histoire', emoji: '🧭', step: 2 },
  script: { title: 'Valide le script', emoji: '📜', step: 3 },
  ending: { title: 'Choisis la fin', emoji: '🎭', step: 4 },
  board: { title: 'Regarde le storyboard', emoji: '🎞️', step: 5 },
  draft: { title: 'Regarde le brouillon', emoji: '🎬', step: 6 },
  done: { title: 'Ta vidéo est prête', emoji: '✅', step: 7 },
};

// ---------- helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const stripBlock = (s) => (s || '').replace(/<!--\s*whatif[\s\S]*?-->/g, '').trim();
const md = (s) => (window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(stripBlock(s))) : `<p>${esc(stripBlock(s)).replace(/\n/g, '<br>')}</p>`);
const ago = (iso) => {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
};
const toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), 2600);
};
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const isBot = (c) => c.user && (c.user.type === 'Bot' || /\[bot\]$/.test(c.user.login));
const blockOf = (c) => {
  const m = (c.body || '').match(/<!--\s*whatif\s+(\{[\s\S]*?\})\s*-->/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch { return null; }
};
const settingsOf = (issue) => {
  const m = (issue.body || '').match(/<!--\s*whatif-settings\s*(\{[\s\S]*?\})\s*-->/);
  try { return { mode: 'guided', quality: 'standard', ...(m ? JSON.parse(m[1]) : {}) }; } catch { return { mode: 'guided', quality: 'standard' }; }
};
const labelOf = (issue) => {
  const names = (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
  return Object.keys(STATUS).find((k) => names.includes(k)) || 'nouveau';
};
const chip = (key, text) => {
  const s = STATUS[key];
  return `<span class="chip ${s.live ? 'live' : ''}" style="color:${s.color};background:color-mix(in srgb, ${s.color} 14%, transparent)"><span class="dot"></span>${esc(text || s.label)}</span>`;
};
const confirmCredits = (what) => confirm(`${what}\n\nÇa utilise environ 1 000 crédits ElevenLabs (la voix).`);

// ---------- GitHub ----------
async function gh(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const r = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${state.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) {
    LS.del('wi_token');
    state.token = '';
    toast('Le jeton n’est plus valide : recolle-le.');
    route('#/setup');
    throw new Error('401');
  }
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}
const repoPath = () => `/repos/${state.repo}`;
// a review file (thumbnail, draft video) from the episode's media branch, as an object URL
async function media(ref, path, v) {
  const key = `${ref}/${path}@${v}`;
  if (state.blobs.has(key)) return state.blobs.get(key);
  if (DEMO) return demoMedia(path);
  const r = await fetch(`https://api.github.com${repoPath()}/contents/${path}?ref=${encodeURIComponent(ref)}`, {
    headers: { Accept: 'application/vnd.github.raw', Authorization: `Bearer ${state.token}`, 'X-GitHub-Api-Version': '2022-11-28' },
  });
  if (!r.ok) throw new Error(String(r.status));
  const url = URL.createObjectURL(await r.blob());
  state.blobs.set(key, url);
  return url;
}

// ---------- the demo ----------
const DEMO_DATA = (() => {
  const now = Date.now();
  const iso = (min) => new Date(now - min * 60000).toISOString();
  const bot = (min, body) => ({ id: Math.random(), user: { login: 'github-actions[bot]', type: 'Bot' }, body, created_at: iso(min) });
  const me = (min, body) => ({ id: Math.random(), user: { login: 'toi', type: 'User' }, body, created_at: iso(min) });
  const hooks = [
    { id: 1, title: 'Un matin banal', text: 'Mardi, 7 h 02. Ton café qui coule. Ton chat qui miaule. Ton réveil que tu n’as pas entendu. Et là, tu remarques un truc : l’horloge ne bouge plus. Rien ne bouge. Sauf toi.' },
    { id: 2, title: 'La phrase choc', text: 'Tu viens d’arrêter le temps. Huit milliards de personnes figées en plein geste. Et tu es le seul à pouvoir bouger.' },
    { id: 3, title: 'La question directe', text: 'Si tu pouvais arrêter le temps dix minutes par jour, tu en ferais quoi ? Réfléchis bien. Parce que ce matin, c’est arrivé.' },
  ];
  const endings = [
    { id: 1, title: 'Quelqu’un d’autre bouge', text: 'Jour 8. Tu arrêtes le temps. Tout se fige. Sauf une femme, au bout de la rue, qui te regarde. Et toi, tu ferais quoi ?' },
    { id: 2, title: 'Le temps ne repart pas', text: 'Jour 8. Tu claques des doigts pour relancer le temps. Rien. Tu claques encore. Rien. Et toi, tu ferais quoi ?' },
    { id: 3, title: 'Le prix', text: 'Jour 8. Dans le miroir, un premier cheveu blanc. Tu as vécu trois semaines de plus que tout le monde. Et toi, tu en ferais quoi ?' },
  ];
  const beats = [
    { id: 1, title: 'Le hook', text: 'Mardi, 7 h 02, tout se fige sauf toi.' },
    { id: 2, title: 'Les questions', text: 'Combien de temps ? Qu’est-ce que tu en fais ? Et ça coûte quoi ?' },
    { id: 3, title: 'Jour 1', text: 'Tu finis ta nuit : 8 h de sommeil en 0 seconde.' },
    { id: 4, title: 'Jour 2', text: 'Tu termines un exposé de 20 pages pendant que ta prof a la bouche ouverte.' },
    { id: 5, title: 'Jour 3', text: 'Tu rattrapes un vase qui tombe chez ta grand-mère. Héros.' },
    { id: 6, title: 'Le déclin 1', text: 'L’air figé est dur comme du béton (molécules immobiles).' },
    { id: 7, title: 'Le déclin 2', text: 'Tu vieillis seul : 1 h figée par jour = 15 jours de plus par an.' },
    { id: 8, title: 'Le réel', text: 'La dilatation du temps est réelle : les horloges du GPS avancent de 38 µs par jour.' },

function demoMedia(path) {

async function demoApi(path, opts) {
  await new Promise((r) => setTimeout(r, 200));
  const d = DEMO_DATA;
  if (/\/issues\?/.test(path)) return d.issues;
  let m = path.match(/\/issues\/(\d+)\/comments/);
  if (m && opts.method === 'POST') {
    const body = JSON.parse(opts.body).body;
    d.comments[m[1]].push({ id: Date.now(), user: { login: 'toi', type: 'User' }, body, created_at: new Date().toISOString() });
    const is = d.issues.find((i) => i.number == m[1]);
    is.labels = [/^\/(board ok|draft ok)|^ok$/i.test(body.trim()) ? 'video-en-cours' : 'script-en-cours'];
    is.updated_at = new Date().toISOString();
    return {};
  }
  if (m) return d.comments[m[1]];
  m = path.match(/\/issues\/(\d+)$/);
  if (m && opts.method === 'PATCH') { d.issues = d.issues.filter((i) => i.number != m[1]); return {}; }
  if (m) return d.issues.find((i) => i.number == m[1]);
  if (/\/issues$/.test(path) && opts.method === 'POST') {
    const b = JSON.parse(opts.body);
    const n = Math.max(...d.issues.map((i) => i.number)) + 1;
    d.issues.unshift({ number: n, title: b.title, body: b.body, labels: [], updated_at: new Date().toISOString(), created_at: new Date().toISOString() });
    d.comments[n] = [];
    return { number: n };
  }
  return {};
}

// ---------- router ----------
function route(hash) {
  if (hash && location.hash !== hash) { location.hash = hash; return; }
  clearInterval(state.timer);
  window.scrollTo(0, 0);
  const h = location.hash || '#/';
  if (!DEMO && !state.token) return viewSetup();
  if (h === '#/setup') return viewSetup();
  if (h === '#/settings') return viewSettings();
  if (h === '#/ideas') return viewIdeas();
  const m = h.match(/^#\/ep\/(\d+)/);
  if (m) return viewEpisode(+m[1]);
  return viewHome();
}
window.addEventListener('hashchange', () => route());

async function renderIdeas(keep) {
  const box = document.getElementById('ideas');
  if (!box) return;
  const guide = keep ? (document.getElementById('guide') || {}).value || '' : '';
  let issue = null, comments = [];
  try {
    issue = (await gh(`${repoPath()}/issues?state=open&per_page=100`)).find(isInspiration) || null;
    if (issue) comments = await gh(`${repoPath()}/issues/${issue.number}/comments?per_page=100`);
  } catch (e) {
    if (e.message !== '401') box.innerHTML = '<div class="card faint">Impossible de charger les idées.</div>';
    return;
  }
  const batches = comments.filter(isBot).map(blockOf).filter((b) => b && b.stage === 'ideas');
  const latest = batches[batches.length - 1];
  const lab = issue ? labelOf(issue) : null;
  const busy = issue && (lab === 'script-en-cours' || lab === 'nouveau');
  const asks = `
    <div class="card"><div class="faint">Tu veux orienter les idées ? (facultatif)</div>
      <input type="text" id="guide" value="${esc(guide)}" placeholder="Ex. : plus scientifique, sur l’argent, plus flippant">

    html = `<div class="card empty"><div class="big">💡</div><p class="dim" style="margin-top:8px">Claude te propose 8 idées « Et si… » taillées pour TikTok, différentes de tes épisodes déjà faits.</p></div>${asks}`;
  } else if (busy) {
    html = `<div class="card"><div class="row spread"><b>💡 Claude cherche des idées…</b><span class="faint">env. 2 min</span></div><div class="progress"><div style="width:45%"></div></div><p class="faint" style="margin-top:10px">Tu peux quitter l’onglet : elles t’attendront.</p></div>`;
  } else if (lab === 'echec') {
    html = `<div class="card faint">⚠️ La dernière recherche a échoué.</div>${asks}`;
  }
  if (latest && !busy) {
    html += `<p class="dim">${latest.options.length} idées. Touche « Faire cette vidéo » pour la lancer avec tes réglages.</p>
      <div class="stack">${latest.options.map((o, k) => `
        <div class="card idea">
          ${o.tag ? `<span class="tag">${esc(TAGS[o.tag] || o.tag)}</span>` : ''}
          <h3>${esc(o.title)}</h3>
          <div class="pitch">${esc(o.pitch || '')}</div>
          ${o.angle ? `<div class="angle">🪝 ${esc(o.angle)}</div>` : ''}

          <button class="btn small" data-use="${k}">🎬 Faire cette vidéo</button>
        </div>`).join('')}</div>${asks}`;
  }
  const older = batches.slice(0, -1).reverse().flatMap((b) => b.options);
  if (older.length && !busy) {
    html += `<details class="card"><summary>Idées précédentes (${older.length}) ›</summary><div class="stack" style="margin-top:12px">${older.map((o, k) => `
      <div class="row spread"><span>${esc(o.title)}</span><button class="btn ghost small inline" data-old="${k}">Utiliser</button></div>`).join('')}</div></details>`;
  }
  box.innerHTML = html;

    buzz();
    route('#/');
    toast('Idée prête : choisis ton mode et lance-la');
  };
  box.querySelectorAll('[data-use]').forEach((b) => (b.onclick = () => use(latest.options[+b.dataset.use])));
  box.querySelectorAll('[data-old]').forEach((b) => (b.onclick = () => use(older[+b.dataset.old])));
  const more = document.getElementById('more');
  if (more) more.onclick = async () => {
    const g = document.getElementById('guide').value.trim();

    try {

        await gh(`${repoPath()}/issues`, { method: 'POST', body: JSON.stringify({ title: '💡 Inspiration', body: `<!-- whatif-inspiration -->\nCette issue alimente l’onglet Inspiration de l’app.${g ? `\n\n/ideas ${g}` : ''}` }) });

      toast('Envoi impossible, réessaie.');
    }
  };
  clearInterval(state.timer);
  if (busy) state.timer = setInterval(() => renderIdeas(true), 15000);
}

function situation(issue, comments) {
  let lab = labelOf(issue);
  const bot = comments.filter(isBot);
  const mine = comments.filter((c) => !isBot(c));
  const lastBot = bot[bot.length - 1];
  const last = comments[comments.length - 1];
  const withBlock = [...bot].reverse().find((c) => blockOf(c));
  const block = withBlock ? blockOf(withBlock) : null;
  if (lab === 'nouveau' && last) {
    // no label (a pipeline hiccup): read it from the conversation
    if (!isBot(last)) lab = OK_RE.test(last.body.trim()) || /^\/(board ok|draft ok)/i.test(last.body) ? 'video-en-cours' : 'script-en-cours';
    else if (/^✅/.test(last.body.trim())) lab = 'video-prete';
    else if (/^⚠️/.test(last.body.trim())) lab = 'echec';
    else if (/^(🎬|🎙️|🛠️|✨)/.test(last.body.trim())) lab = 'video-en-cours';
    else if (block || /Réponds \*\*ok\*\*/.test(last.body)) lab = 'script-pret';
  }
  // the legacy script comments (before the hidden blocks) count as a script step
  const legacyScript = !block && lastBot && /Réponds \*\*ok\*\*/.test(lastBot.body) ? lastBot : null;
  const stage = block ? block.stage : legacyScript ? 'script' : lab === 'video-prete' ? 'done' : null;
  const lastMine = mine[mine.length - 1];
  return { lab, stage, block, blockComment: withBlock || legacyScript, mine, lastMine };
}

function estimate(lastMine, lab) {
  const c = (lastMine && lastMine.body.trim().toLowerCase()) || '';
  if (lab === 'script-en-cours') {
    if (/^\/(ending \d|board)/.test(c)) return { min: 25, text: 'Claude dessine le storyboard plan par plan. Gratuit : pas encore de voix.' };
    return { min: 6, text: 'Claude écrit et vérifie les chiffres.' };
  }
  if (/^\/board ok/.test(c)) return { min: 25, text: 'La voix, le son, puis un brouillon vidéo en 540p.' };
  if (/^\/draft ok/.test(c)) return { min: 20, text: 'Le rendu final, sur 6 machines en parallèle.' };
  if (/^\/draft/.test(c)) return { min: 25, text: 'Claude corrige d’après tes notes, puis un nouveau brouillon.' };
  if (/^\/improve/.test(c)) return { min: 40, text: 'Claude améliore l’animation, puis un nouveau rendu final.' };
  return { min: 45, text: 'Voix, plans, son, puis rendu sur 6 machines en parallèle.' };
}

async function renderEpisode(n, keep) {
  const box = document.getElementById('ep');
  if (!box) return;
  let issue, comments;
  try {
    [issue, comments] = await Promise.all([gh(`${repoPath()}/issues/${n}`), gh(`${repoPath()}/issues/${n}/comments?per_page=100`)]);
  } catch (e) {
    if (e.message !== '401') box.innerHTML = '<div class="card faint">Épisode introuvable.</div>';
    return;
  }
  const set = settingsOf(issue);
  const sit = situation(issue, comments);
  const st = STATUS[sit.lab];
  const stg = sit.stage && STAGE[sit.stage];
  const guidedSteps = 7;
  const stepNow = stg ? stg.step : 0;
  const drafts = keep ? Object.fromEntries([...document.querySelectorAll('textarea[data-keep]')].map((t) => [t.dataset.keep, t.value])) : {};

  let body = '';
  if (st.live) {
    const est = estimate(sit.lastMine, sit.lab);
    const since = new Date((sit.lastMine && sit.lastMine.created_at) || issue.updated_at);
    const pct = Math.min(95, Math.round(((Date.now() - since) / 60000 / est.min) * 100));
    body += `<div class="card"><div class="row spread"><b>${st.emoji} ${st.label}</b><span class="faint">env. ${est.min} min</span></div>
      <div class="progress"><div style="width:${Math.max(4, pct)}%"></div></div>
      <p class="faint" style="margin-top:10px">${est.text} Tu peux fermer l’app : tout se met à jour tout seul.</p></div>`;
  } else if (sit.lab === 'echec') {
    body += `<div class="card stack" style="border-color:rgba(255,90,74,.4)"><b>⚠️ Ça a échoué.</b><p class="dim">Relancer renvoie ta dernière demande. Une voix déjà payée est réutilisée.</p><button class="btn small" id="retry">🔁 Relancer</button></div>`;
  } else if (sit.lab === 'script-pret' && sit.stage) {
    body += stageView(sit, set, drafts);
  } else if (sit.lab === 'video-prete') {
    body += doneView(sit, comments, drafts);
  }

  const history = sit.mine.length
    ? `<details class="card history"><summary>Tes choix et demandes (${sit.mine.length}) ›</summary>${sit.mine.map((c) => `<div class="msg"><div class="faint">${ago(c.created_at)}</div>${esc(c.body)}</div>`).join('')}</details>`
    : '';

  box.innerHTML = `
    <div>
      <div class="faint">Épisode #${n} ${set.mode === 'quick' ? '· ⚡ rapide' : ''} ${set.quality === 'max' ? '· ✨ qualité max' : ''}</div>
      <h1 style="font-size:27px;margin-top:4px">${esc(issue.title)}</h1>
      <div class="row" style="margin-top:10px;flex-wrap:wrap">${chip(sit.lab, sit.lab === 'script-pret' && stg ? `${stg.emoji} ${stg.title}` : '')}</div>
      ${set.mode === 'guided' ? `<div class="stepper">${Array.from({ length: guidedSteps }, (_, i) => `<div class="${i + 1 < stepNow ? 'done' : i + 1 === stepNow ? 'now' : ''}"></div>`).join('')}</div>` : ''}
    </div>
    ${body}${history}`;

  wire(n, sit, set);
  clearInterval(state.timer);
  if (st.live) state.timer = setInterval(() => renderEpisode(n, true), 20000);
}

// ---------- the step views ----------
function stageView(sit, set, drafts) {
  const b = sit.block || { stage: 'script', options: [] };
  const opts = b.options || [];
  const keep = (k) => esc(drafts[k] || '');
  if (b.stage === 'hooks' || b.stage === 'ending') {
    const word = b.stage === 'hooks' ? 'hook' : 'fin';
    return `
      <p class="dim">${b.stage === 'hooks' ? 'Trois façons d’ouvrir ton épisode. Touche celle qui te donne envie de rester.' : 'Trois cliffhangers. Lequel laisse le plus envie de la partie 2 ?'}</p>
      <div class="stack" id="opts">${opts.map((o) => `
        <div class="card opt" data-id="${o.id}"><div class="row"><div class="num">${o.id}</div><h3>${esc(o.title || '')}</h3></div><div class="otext">${esc(o.text)}</div></div>`).join('')}</div>
      <div class="card"><div class="faint">Ajuster ton choix (facultatif)</div><textarea id="tweak" data-keep="tweak" rows="2" placeholder="Ex. : garde le café mais enlève le chat">${keep('tweak')}</textarea></div>
      <button class="btn ghost small" id="regen">🔄 3 ${word === 'hook' ? 'nouveaux hooks' : 'nouvelles fins'}</button>
      <div class="sticky"><button class="btn green" id="pick" disabled>Choisis ${word === 'hook' ? 'un hook' : 'une fin'}</button></div>`;
  }
  if (b.stage === 'outline') {
    return `
      <p class="dim">Le déroulé de l’histoire. Touche ✕ pour retirer un passage, ajoute tes idées en dessous.</p>
      <div class="card stack" id="beats">${opts.map((o) => `
        <div class="beat" data-id="${o.id}"><button class="x" aria-label="Retirer">✕</button><div class="btxt"><b>${esc(o.title)}</b><div class="dim">${esc(o.text)}</div></div></div>`).join('')}</div>
      <div class="card"><div class="faint">Ajouter ou changer quelque chose</div><textarea id="add" data-keep="add" rows="3" placeholder="Ex. : ajoute une scène à la salle de sport au jour 2">${keep('add')}</textarea>
        <div style="margin-top:10px"><button class="btn ghost small" id="sendOutline">✏️ Envoyer mes changements</button></div></div>
      <div class="sticky"><button class="btn green" id="okOutline">✅ Valider le plan</button></div>`;
  }
  if (b.stage === 'script') {
    const quick = set.mode === 'quick';
    return `
      <div class="card md">${md(sit.blockComment.body.replace(/\n*(Réponds \*\*ok\*\*|Valide le script)[^\n]*$/i, ''))}</div>
      <div class="card"><div class="faint">Tu veux changer quelque chose ? Écris-le ici</div><textarea id="change" data-keep="change" rows="3" placeholder="Ex. : plus drôle au jour 2, un autre chiffre…">${keep('change')}</textarea>
        <div style="margin-top:10px"><button class="btn ghost small" id="sendScript">✏️ Envoyer</button></div></div>
      <div class="sticky"><button class="btn green" id="okScript">✅ ${quick ? 'Valider et lancer la vidéo' : 'Valider le script'}</button></div>`;
  }
  if (b.stage === 'board') {
    const shots = b.shots || [];
    return `
      <p class="dim">${shots.length} plans, une image chacun. Touche un plan pour lui écrire une note. Rien n’est dépensé avant ta validation.</p>
      <div class="grid" id="grid">${shots.map((s) => `<button class="shot" data-id="${esc(s.id)}"><img alt="${esc(s.id)}" data-path="${esc(b.path)}/${esc(s.id)}.jpg"><span class="sid">${esc(s.id)}</span></button>`).join('')}</div>
      <div class="card"><div class="faint">Une remarque générale ?</div><textarea id="general" data-keep="general" rows="2" placeholder="Ex. : plus de monde dans les scènes de rue">${keep('general')}</textarea></div>
      <div class="sticky stack"><button class="btn ghost small" id="sendBoard">✏️ Envoyer mes notes</button><button class="btn green" id="okBoard">✅ Valider le storyboard</button></div>`;
  }
  if (b.stage === 'draft') {
    return `
      <div class="card stack"><video id="draftVideo" controls playsinline></video><p class="faint" id="draftState">Chargement du brouillon…</p>
        <button class="btn ghost small" id="mark">📝 Note à ce moment</button>
        <textarea id="dnotes" data-keep="dnotes" rows="4" placeholder="0:42 — la caméra devrait bouger&#10;1:10 — trop rapide">${keep('dnotes')}</textarea>
        <button class="btn ghost small" id="sendDraft">✏️ Envoyer mes notes</button></div>
      <div class="sticky"><button class="btn green" id="okDraft">🎬 Lancer la version finale</button></div>`;
  }
  return '';
}

function doneView(sit, comments, drafts) {
  const videoC = [...comments].reverse().find((c) => isBot(c) && /^✅/.test(c.body.trim()));
  const link = videoC && (videoC.body.match(/\]\((https?:[^)]+)\)/) || [])[1];
  return `
    <div class="card stack"><h2>🎉 La vidéo est prête</h2>
      ${link ? `<a class="btn green" href="${esc(link)}" target="_blank" rel="noopener">▶︎ Ouvrir la vidéo</a>` : ''}
      ${videoC ? `<div class="md faint">${md(videoC.body.replace(/^✅[^\n]*\n?/, ''))}</div>` : ''}</div>
    <div class="card stack"><h3>✨ Améliorer l’animation</h3><p class="faint">Écris ce qui est faible (un moment, une scène). La voix est réutilisée : pas de crédits ElevenLabs.</p>
      <textarea id="improve" data-keep="improve" rows="3" placeholder="Ex. : 0:30 plus de mouvement, la scène du métro plus vivante">${esc(drafts.improve || '')}</textarea>
      <button class="btn small" id="sendImprove">✨ Améliorer et refaire la vidéo</button></div>`;
}

// ---------- the actions ----------
function wire(n, sit, set) {
  const $ = (id) => document.getElementById(id);
  const post = async (body, msg) => {
    try {
      await gh(`${repoPath()}/issues/${n}/comments`, { method: 'POST', body: JSON.stringify({ body }) });
      buzz();
      toast(msg);
      setTimeout(() => renderEpisode(n), 700);
    } catch { toast('Envoi impossible, réessaie.'); }
  };
  if ($('retry')) $('retry').onclick = () => post(sit.lastMine ? sit.lastMine.body : 'Réessaie, s’il te plaît.', 'Relancé');
  const b = sit.block;
  // hooks and endings
  if ($('opts')) {
    let picked = null;
    const word = b.stage === 'hooks' ? 'hook' : 'ending';
    document.querySelectorAll('#opts .opt').forEach((el) => (el.onclick = () => {
      picked = el.dataset.id;
      document.querySelectorAll('#opts .opt').forEach((x) => x.classList.toggle('sel', x === el));
      $('pick').disabled = false;
      $('pick').textContent = `✅ ${word === 'hook' ? 'Garder le hook' : 'Garder la fin'} ${picked}`;
      buzz();
    }));
    $('pick').onclick = () => {
      const t = $('tweak').value.trim();
      post(`/${word} ${picked}${t ? `: ${t}` : ''}`, word === 'hook' ? 'Claude écrit le plan de l’histoire' : 'Claude dessine le storyboard');
    };
    $('regen').onclick = () => {
      const t = $('tweak').value.trim();
      post(`/${word} regen${t ? `: ${t}` : ''}`, 'Trois nouvelles propositions arrivent');
    };
  }
  // outline
  if ($('beats')) {
    document.querySelectorAll('#beats .beat .x').forEach((x) => (x.onclick = () => {
      const row = x.closest('.beat');
      row.classList.toggle('off');
      x.textContent = row.classList.contains('off') ? '↺' : '✕';
    }));
    const changes = () => {
      const off = [...document.querySelectorAll('#beats .beat.off')].map((r) => (b.options.find((o) => String(o.id) === r.dataset.id) || {}).title).filter(Boolean);
      const add = $('add').value.trim();
      return [off.length ? `Retire : ${off.join(', ')}` : '', add].filter(Boolean).join('\n');
    };
    $('sendOutline').onclick = () => {
      const c = changes();
      if (!c) return toast('Retire un passage ou écris un changement.');
      post(`/outline ${c}`, 'Claude revoit le plan');
    };
    $('okOutline').onclick = () => {
      const c = changes();
      post(c ? `/outline ${c}` : '/outline ok', c ? 'Claude revoit le plan avec tes changements' : 'Claude écrit le script');
    };
  }
  // script
  if ($('okScript')) {
    $('okScript').onclick = () => {
      if (set.mode === 'quick') {
        if (!confirmCredits('Lancer la vidéo ?')) return;
        return post('ok', 'Vidéo lancée 🎬');
      }
      post('/script ok', 'Claude propose 3 fins');
    };
    $('sendScript').onclick = () => {
      const v = $('change').value.trim();
      if (!v) return toast('Écris ce que tu veux changer.');
      if (OK_RE.test(v)) return $('okScript').click();
      post(set.mode === 'quick' ? v : `/script ${v}`, 'Claude réécrit le script');
    };
  }
  // storyboard
  if ($('grid')) {
    const notes = {};
    document.querySelectorAll('#grid img').forEach((img) => media(b.ref, img.dataset.path, b.v).then((u) => (img.src = u)).catch(() => (img.alt = '…')));
    const refreshPins = () => {
      document.querySelectorAll('#grid .shot').forEach((el) => {
        const has = !!notes[el.dataset.id];
        el.classList.toggle('noted', has);
        el.querySelector('.pin')?.remove();
        if (has) el.insertAdjacentHTML('beforeend', '<span class="pin">✎</span>');
      });
      const k = Object.keys(notes).length;
      $('sendBoard').textContent = `✏️ Envoyer mes notes${k ? ` (${k})` : ''}`;
    };
    document.querySelectorAll('#grid .shot').forEach((el) => (el.onclick = () => {
      const s = b.shots.find((x) => x.id === el.dataset.id);
      const src = el.querySelector('img').src;
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.innerHTML = `<div class="panel stack"><div class="row spread"><h2>${esc(s.id)} <span class="faint">${esc(s.size)}</span></h2><button class="iconbtn" data-close>✕</button></div>
        ${src ? `<img src="${src}" alt="">` : ''}<p class="dim">${esc(s.note)}</p>
        <textarea rows="3" placeholder="Ta note : gros plan, ajoute le chat, enlève ce plan…">${esc(notes[s.id] || '')}</textarea>
        <button class="btn" data-save>Enregistrer la note</button></div>`;
      document.body.appendChild(sheet);
      const close = () => sheet.remove();
      sheet.onclick = (e) => { if (e.target === sheet) close(); };
      sheet.querySelector('[data-close]').onclick = close;
      sheet.querySelector('[data-save]').onclick = () => {
        const v = sheet.querySelector('textarea').value.trim();
        if (v) notes[s.id] = v; else delete notes[s.id];
        close();
        refreshPins();
      };
    }));
    const lines = () => [...Object.entries(notes).map(([k, v]) => `${k}: ${v}`), $('general').value.trim()].filter(Boolean).join('\n');
    $('sendBoard').onclick = () => {
      const l = lines();
      if (!l) return toast('Touche un plan pour lui écrire une note.');
      post(`/board ${l}`, 'Claude redessine ces plans');
    };
    $('okBoard').onclick = () => {
      if (lines()) return toast('Envoie d’abord tes notes, ou efface-les.');
      if (!confirmCredits('Valider le storyboard ? La voix et le son vont être générés, puis un brouillon vidéo.')) return;
      post('/board ok', 'Storyboard validé : la voix et le brouillon arrivent 🎙️');
    };
  }
  // draft
  if ($('draftVideo')) {
    media(b.ref, b.path, b.v).then((u) => { $('draftVideo').src = u; $('draftState').textContent = 'Le brouillon (540p) : la qualité finale sera meilleure.'; })
      .catch(() => ($('draftState').textContent = DEMO ? 'En démo, pas de vraie vidéo.' : 'Impossible de charger le brouillon.'));
    $('mark').onclick = () => {
      const t = Math.floor($('draftVideo').currentTime || 0);
      const stamp = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')} — `;
      const ta = $('dnotes');
      ta.value = (ta.value ? ta.value.replace(/\s*$/, '\n') : '') + stamp;
      ta.focus();
    };
    $('sendDraft').onclick = () => {
      const v = $('dnotes').value.trim();
      if (!v) return toast('Écris au moins une note.');
      post(`/draft ${v}`, 'Claude corrige, puis un nouveau brouillon');
    };
    $('okDraft').onclick = () => {
      if ($('dnotes').value.trim()) return toast('Envoie d’abord tes notes, ou efface-les.');
      post('/draft ok', 'Rendu final lancé 🎬');
    };
  }
  // improve
  if ($('sendImprove')) $('sendImprove').onclick = () => {
    const v = $('improve').value.trim();
    if (!v) return toast('Écris ce que tu veux améliorer.');
    post(`/improve ${v}`, 'Claude améliore l’animation ✨');
  };
}

if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
route();
</script>
</body>
